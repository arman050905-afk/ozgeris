<style>
:root{
  color-scheme:dark;
  --bg:#0a0a14;
  --ink:#f6f4ff; --ink-2:#e2deef; --muted:#b4aec8; --quiet:#8d87a3;
  --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.34);
  --glass:rgba(16,14,26,.74); --glass-hover:rgba(38,34,56,.9);
  --solid:#fbfaff; --solid-hover:#ebe7f7; --on-solid:#14111f;
  --tint:rgba(255,255,255,.05); --tint-2:rgba(255,255,255,.1);
  --shadow:rgba(0,0,0,.45);
  --scrim:rgba(6,5,12,.72);
  --panel:#15131f; --panel-2:#1d1a2b;
  --grad-1:#7c5cff; --grad-2:#c045e8; --grad-3:#ff5da2;
  --grad:linear-gradient(135deg,var(--grad-1) 0%,var(--grad-2) 55%,var(--grad-3) 100%);
  --good:#3ecf93;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f3f1fa;
  --ink:#15121f; --ink-2:#2f2b3d; --muted:#5d5870; --quiet:#7d7891;
  --line:rgba(20,16,40,.13); --line-strong:rgba(20,16,40,.3);
  --glass:rgba(255,255,255,.82); --glass-hover:rgba(244,241,252,.96);
  --solid:#15121f; --solid-hover:#2c2840; --on-solid:#fff;
  --tint:rgba(20,16,40,.04); --tint-2:rgba(20,16,40,.08);
  --shadow:rgba(30,20,60,.18);
  --scrim:rgba(40,32,70,.38);
  --panel:#ffffff; --panel-2:#f4f1fb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--grad-1);outline-offset:3px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:50}
#fade.on{opacity:1}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);transition:opacity .6s ease,visibility .6s}
#loader.done{opacity:0;visibility:hidden}
.ld{width:min(340px,80vw)}
.ld-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--quiet);display:flex;justify-content:space-between}
.ld-pct{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;margin:14px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ld-bar{height:3px;background:var(--tint-2);border-radius:3px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .35s var(--ease)}
.ld-title{margin-top:18px;font-weight:700;font-size:16px}
.ld-step{margin-top:4px;color:var(--muted);font-size:13px;min-height:1.4em}

/* ---------- header ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 40px;pointer-events:none}
.top>*{pointer-events:auto}
.top-l,.top-r{display:flex;align-items:center;gap:10px;flex:1}
.top-r{justify-content:flex-end}
.logo{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center}
.logo b{width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;box-shadow:0 6px 18px -6px #c045e8}
.pill{display:flex;gap:2px;padding:4px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pill button,.pill a{padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.pill button:hover,.pill a:hover{color:var(--ink)}
.pill .on{background:var(--tint-2);color:var(--ink)}
.icon-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;transition:background .2s,border-color .2s}
.icon-btn:hover{background:var(--glass-hover);border-color:var(--line-strong)}
.icon-btn:hover svg{transform:rotate(18deg)}
.icon-btn svg{transition:transform .45s var(--ease)}
.lang{display:flex;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang button{padding:8px 10px;border-radius:10px;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--quiet)}
.lang button.on{background:var(--tint-2);color:var(--ink)}
.lang-sm{display:none;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.04em}
.cta{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;background:var(--solid);color:var(--on-solid);font-weight:700;font-size:14px;white-space:nowrap;transition:background .2s,transform .2s}
.cta:hover{background:var(--solid-hover)}
.cta.grad{background:var(--grad);color:#fff;box-shadow:0 10px 30px -12px #c045e8}

/* ---------- shared buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--line-strong);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:15px;white-space:nowrap;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--glass-hover)}
.btn.solid{background:var(--solid);color:var(--on-solid);border-color:transparent}
.btn.solid:hover{background:var(--solid-hover)}
.btn.grad{background:var(--grad);color:#fff;border-color:transparent}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px #c045e8}
.hint{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--quiet)}

/* ---------- room UI ---------- */
.ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.ui .pane{position:absolute;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .5s ease,transform .6s var(--ease),visibility .5s}
.ui .pane>*{pointer-events:auto}
body[data-view=room][data-stop=desk] .pane.desk,
body[data-view=room][data-stop=board] .pane.board,
body[data-view=room][data-stop=shelf] .pane.shelf{opacity:1;visibility:visible;transform:none;transition-delay:.35s}
body:not([data-view=room]) #roomUI,body:not([data-view=city]) #cityUI{display:none}
body:not([data-view=room]) .room-only,body:not([data-view=city]) .city-only{display:none!important}

.hero{left:40px;top:50%;margin-top:-170px;width:380px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:1;letter-spacing:-.02em;margin:20px 0 14px}
.hero .sub{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.hero p{font-size:16px;line-height:1.55;color:var(--ink-2);margin:22px 0 26px}
.hero .row{display:flex;gap:10px;margin-bottom:22px}

#screenBtn{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:rgba(12,10,20,.82);color:#fff;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;transition:opacity .3s ease,background .2s;opacity:0;white-space:nowrap}
#screenBtn:hover{background:rgba(124,92,255,.9)}
#screenBtn.show{opacity:1}

.board-bar{left:50%;bottom:22px;transform:translateX(-50%)!important;display:flex;gap:10px}
body[data-stop=board] .board-bar{transform:translateX(-50%)!important}
.side-link{position:absolute;top:50%;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink-2);padding:10px 4px}
.side-link:hover{color:var(--ink)}
.board-next{right:40px}

.shelf-panel{left:40px;top:96px;bottom:40px;width:390px;display:flex;flex-direction:column}
.back-link{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink-2);padding:6px 0;align-self:flex-start}
.sp-body{margin-top:auto;margin-bottom:auto}
.sp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px dashed var(--line)}
.sp-count{font-family:var(--f-mono);font-size:20px}
.sp-count small{font-size:11px;color:var(--quiet);letter-spacing:.14em;margin-left:6px}
.arrows{display:flex;gap:8px}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;transition:background .2s}
.round:hover{background:var(--tint-2)}
.round svg.i{width:15px;height:15px}
.sp-title{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.12;margin:22px 0 10px;letter-spacing:-.01em}
.sp-meta{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sp-meta i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sp-desc{font-size:15px;line-height:1.6;color:var(--ink-2);margin:16px 0 18px}
.sp-stats{display:flex;gap:26px;border-left:1px solid var(--line-strong);padding-left:16px;margin-bottom:22px}
.sp-stats:empty{display:none}
.sp-stats b{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.sp-stats span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;padding:6px 9px;border:1px solid var(--line-strong);border-radius:7px;color:var(--ink-2)}
.sp-actions{display:flex;gap:10px}
.sp-actions .btn{flex:1}

/* ---------- city UI ---------- */
.city-l{position:fixed;left:40px;top:84px;z-index:12}
.chip-btn{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700;font-size:14px;transition:background .2s}
.chip-btn:hover{background:var(--glass-hover)}
.guide-card{position:fixed;right:40px;top:84px;z-index:12;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:16px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:left;transition:background .2s}
.guide-card:hover{background:var(--glass-hover)}
.avatar{width:44px;height:44px;border-radius:12px;background:#2a2340;display:grid;place-items:center;overflow:hidden}
.guide-card b{display:block;font-size:14.5px}
.guide-card small{display:block;font-size:12px;color:var(--muted)}
.guide-card .i{margin-left:8px;color:var(--muted)}
.blist{position:fixed;right:40px;bottom:96px;z-index:12;display:flex;flex-direction:column;gap:8px;width:300px;transition:opacity .3s,transform .4s var(--ease)}
.blist.hide{opacity:0;transform:translateX(20px);pointer-events:none}
.bitem{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700;font-size:14px;text-align:left;transition:background .2s,border-color .2s}
.bitem:hover{background:var(--glass-hover);border-color:var(--line-strong)}
.bitem .n{font-family:var(--f-mono);font-size:10px;color:var(--quiet);width:16px}
.bitem .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff}
.bitem .dot svg.i{width:13px;height:13px;stroke-width:2.2}
.bitem .nm{flex:1}
.bitem .go{color:var(--muted)}
.toolbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:12;display:flex;gap:10px}
.tb{display:flex;align-items:center;gap:2px;padding:4px;border-radius:15px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tb button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:700;transition:background .2s}
.tb button:hover,.tb button.on{background:var(--tint-2)}
.tb .zoom{font-family:var(--f-mono);font-size:11px;min-width:44px;text-align:center;color:var(--ink-2)}
#minimap{position:fixed;left:40px;bottom:24px;z-index:12;width:200px;height:200px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:crosshair;transition:opacity .3s,transform .4s var(--ease)}
#minimap.hide{opacity:0;transform:translateY(12px);pointer-events:none}
#prompt{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);z-index:13;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:14px;background:var(--solid);color:var(--on-solid);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);box-shadow:0 12px 30px -10px var(--shadow)}
#prompt.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#prompt kbd{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border-radius:8px;background:var(--grad);color:#fff}
.tags{position:fixed;inset:0;pointer-events:none;z-index:9}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 9px;border-radius:7px;background:#fff;color:#14111f;font-size:12.5px;font-weight:800;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tag::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.tags.off{display:none}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.open{opacity:1;visibility:visible}
.card{position:relative;width:min(560px,100%);max-height:calc(100dvh - 48px);overflow:auto;border-radius:24px;border:1px solid var(--line);background:linear-gradient(165deg,var(--panel),var(--panel-2));box-shadow:0 30px 80px -20px rgba(0,0,0,.6);padding:34px;transform:translateY(14px) scale(.98);transition:transform .45s var(--ease)}
.modal.open .card{transform:none}
.card.wide{width:min(720px,100%)}
.x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .2s}
.x:hover{background:var(--tint-2);color:var(--ink)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.15;margin:14px 0 10px;letter-spacing:-.01em}
.card h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:26px 0 8px}
.card p{font-size:15.5px;line-height:1.7;color:var(--ink-2);margin:0 0 14px}
.card .lead{color:var(--muted)}
.card ul{list-style:none;padding:0;margin:18px 0 24px;display:grid;gap:10px}
.card li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5;color:var(--ink-2)}
.card li svg.i{margin-top:2px;color:var(--good)}
.card .acts{display:flex;gap:10px;flex-wrap:wrap}
.mod-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff}
.mod-badge svg.i{width:26px;height:26px}
.price{display:flex;align-items:baseline;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
.price b{font-family:var(--f-display);font-weight:800;font-size:46px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.price s{color:var(--quiet);font-size:18px}
.price em{font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:var(--grad);color:#fff}
.quote{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.45;padding:16px 18px;border-left:3px solid var(--grad-2);background:var(--tint);border-radius:0 12px 12px 0;margin:22px 0}

/* chat */
#chat{position:fixed;right:40px;top:84px;bottom:24px;width:380px;z-index:30;display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--line);background:linear-gradient(165deg,var(--panel),var(--panel-2));box-shadow:0 30px 80px -20px rgba(0,0,0,.55);transform:translateX(24px);opacity:0;visibility:hidden;transition:opacity .3s,transform .45s var(--ease),visibility .3s}
#chat.open{opacity:1;visibility:visible;transform:none}
.ch-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line)}
.ch-head b{display:block;font-size:15px}
.ch-head small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ch-head small::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--good)}
.ch-head .x{position:static;margin-left:auto}
.ch-log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.5}
.msg.bot{background:var(--tint-2);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--grad);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.msg .acts button,.msg .acts a{font-size:13px;font-weight:700;padding:7px 11px;border-radius:10px;background:var(--solid);color:var(--on-solid)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ch-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.ch-chips button{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);transition:background .2s}
.ch-chips button:hover{background:var(--tint-2)}
.ch-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.ch-form input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--tint);outline:none}
.ch-form input:focus{border-color:var(--grad-1)}
.ch-form button{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);z-index:45;max-width:min(560px,calc(100vw - 32px));padding:12px 16px;border-radius:14px;background:var(--solid);color:var(--on-solid);font-size:14px;line-height:1.5;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.skip{position:fixed;left:16px;top:-60px;z-index:70;padding:10px 14px;border-radius:10px;background:var(--solid);color:var(--on-solid);font-weight:700}
.skip:focus{top:16px}

/* ---------- phone ---------- */
@media (max-width:900px){
  .top{padding:14px 16px}
  .top .cta,.top .seg-view{display:none}
  .hero{left:16px;right:16px;width:auto;top:auto;bottom:24px;margin-top:0}
  .hero h1{font-size:48px;margin:14px 0 10px}
  .hero p{font-size:15px;margin:14px 0 18px}
  .hero .row .btn{flex:1}
  .hero .hint{display:none}
  .shelf-panel{left:16px;right:16px;width:auto;top:auto;bottom:16px;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .shelf-panel .back-link,.sp-desc,.sp-stats,.chips{display:none}
  .sp-head{border-top:0;padding-top:0}
  .sp-title{font-size:22px;margin:12px 0 8px}
  .sp-meta{margin-bottom:14px}
  .sp-actions .btn{min-width:0;padding:0 12px;font-size:14px}
  .sp-actions .btn svg{display:none}
  .board-bar{left:16px;right:16px;bottom:16px;transform:none!important}
  body[data-stop=board] .board-bar{transform:none!important}
  .board-bar .btn{flex:1;padding:0 12px}
  .board-next{right:16px;top:auto;bottom:80px}
  .city-l{left:16px;top:76px}
  .guide-card{right:16px;top:76px;padding:6px 10px 6px 6px}
  .guide-card .txt small,.guide-card>.i{display:none}
  .avatar{width:34px;height:34px}
  .blist{left:16px;right:16px;width:auto;bottom:84px}
  .toolbar{left:16px;right:16px;transform:none;bottom:16px;justify-content:center}
  .tb .hide-sm{display:none}
  #minimap{left:16px;bottom:84px;width:160px;height:160px}
  #prompt{bottom:84px}
  #chat{left:12px;right:12px;top:auto;bottom:12px;height:min(560px,calc(100dvh - 90px));width:auto}
  .card{padding:26px 22px}
  #toast{top:auto;bottom:150px}
}
@media (max-width:600px){
  .top{gap:6px;padding:12px}
  .lang{display:none}
  .lang-sm{display:grid}
  .top-l,.top-r{flex:none;gap:6px}
  .icon-btn,.logo{width:40px;height:40px;border-radius:12px}
  .logo b{width:26px;height:26px;font-size:13px}
  .pill{padding:3px}
  .pill button{padding:8px 8px;font-size:12.5px}
  .pill .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

/* Воксель құрастырушы: көп текшені бір геометрияға біріктіреді (draw call аз) */
const _col = new THREE.Color();
class Vox{
  constructor(){ this.std = []; this.glow = []; }
  box(x,y,z,w,h,d,color,o={}){
    const g = new THREE.BoxGeometry(w,h,d);
    if(o.rx) g.rotateX(o.rx);
    if(o.rz) g.rotateZ(o.rz);
    if(o.ry) g.rotateY(o.ry);
    g.translate(x, y+h/2, z);
    _col.set(color);
    if(o.j) _col.multiplyScalar(1 + (Math.random()-.5)*o.j);
    const n = g.attributes.position.count, a = new Float32Array(n*3);
    for(let i=0;i<n;i++){ a[i*3]=_col.r; a[i*3+1]=_col.g; a[i*3+2]=_col.b; }
    g.setAttribute('color', new THREE.BufferAttribute(a,3));
    (o.glow ? this.glow : this.std).push(g);
    return this;
  }
  build({cast=true, receive=true}={}){
    const grp = new THREE.Group();
    if(this.std.length){ const m = new THREE.Mesh(mergeGeometries(this.std), MAT.std); m.castShadow = cast; m.receiveShadow = receive; grp.add(m); }
    if(this.glow.length){ const m = new THREE.Mesh(mergeGeometries(this.glow), MAT.glow); grp.add(m); }
    this.std.forEach(g=>g.dispose()); this.glow.forEach(g=>g.dispose());
    this.std = []; this.glow = [];
    return grp;
  }
}

/* Canvas текстуралары */
function canvasTex(w, h, draw, {repeat=null, srgb=true}={}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  draw(x, w, h);
  const tx = new THREE.CanvasTexture(c);
  if(srgb) tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if(repeat){ tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repeat[0], repeat[1]); }
  tx.userData = {c, x, draw};
  return tx;
}
function redraw(tx){ const {c,x,draw} = tx.userData; x.clearRect(0,0,c.width,c.height); draw(x,c.width,c.height); tx.needsUpdate = true; }
function rnd(a,b){ return a + Math.random()*(b-a); }
function shade(hex, k){ const c = new THREE.Color(hex); c.multiplyScalar(k); return '#'+c.getHexString(); }
function rr(x, X, Y, W, H, R){ x.beginPath(); x.roundRect(X,Y,W,H,R); }
function wrap(x, text, X, Y, maxW, lh){
  const words = text.split(' '); let line = '';
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(x.measureText(test).width > maxW && line){ x.fillText(line, X, Y); Y += lh; line = w; }
    else line = test;
  }
  if(line){ x.fillText(line, X, Y); Y += lh; }
  return Y;
}
function fitText(x, text, maxW, size, weight, family){
  let s = size;
  do{ x.font = `${weight} ${s}px ${family}`; s -= 2; } while(x.measureText(text).width > maxW && s > 10);
}

function makeSign(mod, w, h){
  const tx = canvasTex(512, Math.round(512*h/w), (x,W,H)=>{
    rr(x,0,0,W,H,H*.18); x.fillStyle = mod.color; x.fill();
    x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(0,H-H*.12,W,H*.12);
    const txt = L(mod.sign);
    fitText(x, txt, W*.84, Math.round(H*.56), 800, 'Unbounded');
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(txt, W/2, H*.47);
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tx, toneMapped:false}));
  m.material.color.setScalar(.92);
  signs.push(tx);
  return m;
}
function plinth(v,w,d){ v.box(0,0,0,w,P,d,'#cdbba2',{j:.03}); }
function windows(v,{cx=0,cz=0,y0,w,h,d,floors,cols,ww=.9,wh=1.2,glow='#ffe2b0',frame='#3b3b3b',sides='fblr',door=false,dark=.18}){
  const fh = h/floors;
  for(let f=0; f<floors; f++){
    const wy = y0 + fh*f + fh*.5 - wh/2 + (f===0 ? .12 : 0);
    for(const s of sides){
      const fb = s==='f'||s==='b';
      const Ln = fb ? w : d;
      const n = fb ? cols : Math.max(1, Math.round(cols*d/w));
      for(let c=0;c<n;c++){
        const u = -Ln/2 + Ln/n*(c+.5);
        if(door && s==='f' && f===0 && Math.abs(u) < 1.1) continue;
        const lit = Math.random() > dark;
        const col = lit ? glow : '#262b38';
        if(s==='f'){ v.box(cx+u, wy-.09, cz+d/2+.02, ww+.18, wh+.18, .05, frame); v.box(cx+u, wy, cz+d/2+.05, ww, wh, .04, col, {glow:lit, j:.3}); }
        if(s==='b'){ v.box(cx+u, wy-.09, cz-d/2-.02, ww+.18, wh+.18, .05, frame); v.box(cx+u, wy, cz-d/2-.05, ww, wh, .04, col, {glow:lit, j:.3}); }
        if(s==='l'){ v.box(cx-w/2-.02, wy-.09, cz+u, .05, wh+.18, ww+.18, frame); v.box(cx-w/2-.05, wy, cz+u, .04, wh, ww, col, {glow:lit, j:.3}); }
        if(s==='r'){ v.box(cx+w/2+.02, wy-.09, cz+u, .05, wh+.18, ww+.18, frame); v.box(cx+w/2+.05, wy, cz+u, .04, wh, ww, col, {glow:lit, j:.3}); }
      }
    }
  }
}

function makeBuilding(mod, {cast=true}={}){
  const v = new Vox();
  const info = BUILDERS[mod.id](v);
  const g = v.build({cast});
  const s = makeSign(mod, info.sign.w, info.sign.h);
  s.position.set(0, info.sign.y, info.sign.z);
  g.add(s);
  g.userData.front = info.front;
  return g;
}

function makePerson(p){
  const g = new THREE.Group();
  const mats = {};
  const m = c => mats[c] || (mats[c] = new THREE.MeshStandardMaterial({color:c, roughness:.85}));
  const B = (w,h,d,c,x,y,z,parent=g) => { const me = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m(c)); me.position.set(x,y,z); me.castShadow = true; parent.add(me); return me; };
  const limb = (x,y) => { const piv = new THREE.Group(); piv.position.set(x,y,0); g.add(piv); return piv; };
  const hipL = limb(-.14,.82), hipR = limb(.14,.82);
  for(const h of [hipL,hipR]){ B(.24,.72,.28,p.pants,0,-.36,0,h); B(.26,.12,.36,'#1b1b20',0,-.78,.03,h); }
  B(.6,.66,.34,p.shirt,0,1.15,0);
  if(p.vest) B(.62,.3,.36,p.vest,0,1.32,0);
  const armL = limb(-.39,1.42), armR = limb(.39,1.42);
  for(const a of [armL,armR]){ B(.18,.58,.22,p.shirt,0,-.27,0,a); B(.16,.13,.18,p.skin,0,-.62,0,a); }
  B(.46,.46,.44,p.skin,0,1.73,0);
  B(.5,.16,.48,p.hair,0,1.98,-.01);
  B(.5,.34,.12,p.hair,0,1.82,-.2);
  if(p.long) B(.5,.5,.1,p.hair,0,1.55,-.25);
  B(.07,.08,.02,'#16121c',-.1,1.76,.225); B(.07,.08,.02,'#16121c',.1,1.76,.225);
  g.userData = {hipL,hipR,armL,armR,phase:Math.random()*6,speed:0};
  return g;
}
function animPerson(pp, speed, dt){
  const u = pp.userData;
  u.phase += dt * (4 + speed*1.6);
  const k = Math.min(1, speed/2.5);
  const s = Math.sin(u.phase) * .7 * k;
  u.hipL.rotation.x = THREE.MathUtils.lerp(u.hipL.rotation.x, s, .3);
  u.hipR.rotation.x = THREE.MathUtils.lerp(u.hipR.rotation.x, -s, .3);
  u.armL.rotation.x = THREE.MathUtils.lerp(u.armL.rotation.x, -s*.85, .3);
  if(!u.waving) u.armR.rotation.x = THREE.MathUtils.lerp(u.armR.rotation.x, s*.85, .3);
}

function texPavers(){
  return canvasTex(512,512,(x,W,H)=>{
    x.fillStyle = '#7a4c44'; x.fillRect(0,0,W,H);
    const bw = 64, bh = 32;
    for(let r=0;r<H/bh;r++){
      const off = (r%2)*bw/2;
      for(let c=-1;c<W/bw+1;c++){
        x.fillStyle = `hsl(${8+Math.random()*10},${26+Math.random()*10}%,${46+Math.random()*12}%)`;
        x.fillRect(c*bw+off+2, r*bh+2, bw-4, bh-4);
      }
    }
  },{repeat:[16,16]});
}
function texSky(stops){
  return canvasTex(4,512,(x,W,H)=>{ const g = x.createLinearGradient(0,0,0,H); stops.forEach(([o,c])=>g.addColorStop(o,c)); x.fillStyle = g; x.fillRect(0,0,W,H); });
}
function tree(v,x,z,s=1,planter=true){
  if(planter){ v.box(x,0,z,1.9,.5,1.9,'#8a5a35',{j:.08}); v.box(x,.5,z,1.6,.06,1.6,'#3b2a1e'); }
  const y0 = planter ? .5 : 0;
  v.box(x,y0,z,.42*s,2.1*s,.42*s,'#6b4a2f',{j:.1});
  const greens = ['#4f8a3a','#5f9a45','#3f7a32','#6aa64c'];
  for(let i=0;i<11;i++){
    const w = rnd(.9,1.6)*s;
    v.box(x+rnd(-.9,.9)*s, y0+rnd(1.7,3.4)*s, z+rnd(-.9,.9)*s, w, rnd(.8,1.3)*s, rnd(.9,1.6)*s, pick(greens), {j:.15});
  }
}
function lampPost(v,x,z){
  v.box(x,0,z,.4,.3,.4,'#1d1d22'); v.box(x,.3,z,.14,3.0,.14,'#1d1d22');
  v.box(x,3.25,z,.5,.08,.5,'#1d1d22'); v.box(x,3.33,z,.38,.42,.38,'#ffe2a8',{glow:true}); v.box(x,3.75,z,.56,.12,.56,'#1d1d22');
}
function bench(v,x,z,ry){
  const c = Math.cos(ry), s = Math.sin(ry);
  const P2 = (lx,lz) => [x + lx*c + lz*s, z - lx*s + lz*c];
  let [a,b] = P2(0,0); v.box(a,.45,b,1.9,.1,.55,'#a8744a',{ry});
  [a,b] = P2(0,-.25); v.box(a,.55,b,1.9,.5,.1,'#a8744a',{ry});
  for(const lx of [-.8,.8]){ [a,b] = P2(lx,0); v.box(a,0,b,.1,.45,.5,'#2a2a30',{ry}); }
}
function flowerBed(v,x,z,ry=0){
  v.box(x,0,z,2.2,.4,1.0,'#9c958a',{ry});
  v.box(x,.4,z,2.0,.05,.8,'#3b2a1e',{ry});
  const cols = ['#ff7aa8','#ffffff','#f0ab52','#c45cff','#ff5f5f'];
  const c = Math.cos(ry), s = Math.sin(ry);
  for(let i=0;i<14;i++){ const lx = rnd(-.9,.9), lz = rnd(-.32,.32); v.box(x+lx*c+lz*s,.45,z-lx*s+lz*c,.18,rnd(.12,.3),.18,pick(cols)); }
  for(let i=0;i<6;i++){ const lx = rnd(-.9,.9), lz = rnd(-.32,.32); v.box(x+lx*c+lz*s,.45,z-lx*s+lz*c,.3,.18,.3,'#4f8a3a'); }
}
function makeLogoCube(){
  const tx = canvasTex(256,256,(x,W,H)=>{
    const g = x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#7c5cff'); g.addColorStop(.55,'#c045e8'); g.addColorStop(1,'#ff5da2');
    x.fillStyle = g; x.fillRect(0,0,W,H);
    x.fillStyle = '#fff'; x.font = '800 150px Unbounded'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('Ö', W/2, H/2+8);
  });
  return new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), new THREE.MeshBasicMaterial({map:tx, toneMapped:false}));
}

function buildCity(){
  const S = city.scene;
  skyNight = texSky([[0,'#2b2560'],[.45,'#7a4c9a'],[.75,'#e0789a'],[1,'#ffb98a']]);
  skyDay = texSky([[0,'#4a86e8'],[.6,'#9cc6ff'],[1,'#e6f1ff']]);
  S.background = skyNight;
  S.fog = new THREE.Fog('#e89a98', 55, 130);

  const grass = new THREE.Mesh(new THREE.PlaneGeometry(320,320), new THREE.MeshStandardMaterial({color:'#4d7a3a', roughness:1}));
  grass.rotation.x = -Math.PI/2; grass.receiveShadow = true; S.add(grass);
  const pave = new THREE.Mesh(new THREE.CircleGeometry(30,72), new THREE.MeshStandardMaterial({map:texPavers(), roughness:.95}));
  pave.rotation.x = -Math.PI/2; pave.position.y = .02; pave.receiveShadow = true; S.add(pave); city.ground = [grass, pave];
  const curb = new THREE.Mesh(new THREE.RingGeometry(29.8,30.4,72), new THREE.MeshStandardMaterial({color:'#9c958a'}));
  curb.rotation.x = -Math.PI/2; curb.position.y = .04; S.add(curb);

  // ғимараттар шеңбер бойымен, бетімен орталыққа қарап тұр
  MODS.forEach((m,i)=>{
    const a = -Math.PI/2 + i*Math.PI*2/MODS.length;
    const x = Math.cos(a)*CITY_R, z = Math.sin(a)*CITY_R;
    const b = makeBuilding(m);
    b.position.set(x,0,z);
    b.rotation.y = Math.atan2(-x,-z);
    b.userData.idx = i;
    b.traverse(o=>{ if(o.isMesh){ o.userData.idx = i; city.pick.push(o); } });
    S.add(b);
    const dir = V(-x,0,-z).normalize();
    const entrance = V(x,0,z).addScaledVector(dir, b.userData.front + 2.2);
    city.buildings.push({mod:m, group:b, pos:V(x,0,z), entrance, angle:a, rot:b.rotation.y});
    city.obstacles.push({x,z,r:4.4});
  });

  const v = new Vox();
  const N = MODS.length;
  for(let i=0;i<N;i++){
    const a = -Math.PI/2 + i*Math.PI*2/N, ab = a + Math.PI/N;
    const lx = Math.cos(ab)*15.5, lz = Math.sin(ab)*15.5; lampPost(v,lx,lz); city.obstacles.push({x:lx,z:lz,r:.35});
    const tx = Math.cos(ab)*10.5, tz = Math.sin(ab)*10.5; tree(v,tx,tz); city.obstacles.push({x:tx,z:tz,r:1.25});
    const bx = Math.cos(ab+.2)*10.6, bz = Math.sin(ab+.2)*10.6; bench(v,bx,bz,Math.atan2(-bx,-bz)); city.obstacles.push({x:bx,z:bz,r:.85});
    const ox = Math.cos(ab)*24.5, oz = Math.sin(ab)*24.5; tree(v,ox,oz,1.15,false); city.obstacles.push({x:ox,z:oz,r:.9});
    for(const sgn of [-1,1]){
      const fa = a + sgn*.3, fx = Math.cos(fa)*17.2, fz = Math.sin(fa)*17.2;
      flowerBed(v,fx,fz,Math.atan2(-fx,-fz)); city.obstacles.push({x:fx,z:fz,r:1.05});
    }
  }
  // фонтан
  for(let k=0;k<14;k++){ const a = k/14*Math.PI*2; v.box(Math.cos(a)*2.9,0,Math.sin(a)*2.9,1.45,.7,.5,'#bdb5a8',{ry:-a+Math.PI/2,j:.04}); }
  v.box(0,0,0,1.3,2.2,1.3,'#cfc7ba'); v.box(0,2.2,0,1.7,.25,1.7,'#bdb5a8');
  for(let k=0;k<4;k++){ const a = k*Math.PI/2; v.box(Math.cos(a)*.66,.9,Math.sin(a)*.66,.2,.2,.2,'#9fe3ff',{glow:true}); }
  city.obstacles.push({x:0,z:0,r:3.4});
  // сыртқы орман және төбелер
  for(let i=0;i<70;i++){ const a = Math.random()*Math.PI*2, r = rnd(33,55); tree(v,Math.cos(a)*r,Math.sin(a)*r,rnd(1,1.7),false); }
  for(let i=0;i<16;i++){ const a = i/16*Math.PI*2 + rnd(-.1,.1), r = rnd(78,95); v.box(Math.cos(a)*r,0,Math.sin(a)*r,rnd(20,34),rnd(5,13),rnd(16,24),'#5c7d4a',{ry:-a,j:.15}); }
  const deco = v.build(); S.add(deco);

  water = new THREE.Mesh(new THREE.CylinderGeometry(2.75,2.75,.1,40), new THREE.MeshStandardMaterial({color:'#3aa6d0', emissive:'#1b6f9a', emissiveIntensity:.5, roughness:.15, metalness:.1}));
  water.position.y = .5; S.add(water);
  logoCube = makeLogoCube(); logoCube.position.set(0,3.4,0); S.add(logoCube);
  R.logoLight = new THREE.PointLight('#c45cff', 9, 10, 1.6); R.logoLight.position.set(0,3.4,0); S.add(R.logoLight);

  // жарық
  R.cHemi = new THREE.HemisphereLight('#ffd7c2','#3d2f4a',.75); S.add(R.cHemi);
  R.sun = new THREE.DirectionalLight('#ffb37a', 2.6);
  R.sun.castShadow = true; R.sun.shadow.mapSize.set(2048,2048);
  const sc = R.sun.shadow.camera; sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 140;
  R.sun.shadow.bias = -.0006; R.sun.shadow.normalBias = .05;
  S.add(R.sun, R.sun.target);

  // ойыншы, гид, тұрғындар
  city.player = makePerson({skin:'#e0ac85', hair:'#2a1b14', shirt:'#7c5cff', pants:'#26233a'});
  city.player.position.set(0,0,9.5); city.player.rotation.y = Math.PI; S.add(city.player);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.55,.7,32), new THREE.MeshBasicMaterial({color:'#ffffff', transparent:true, opacity:.85, toneMapped:false}));
  ring.rotation.x = -Math.PI/2; ring.position.y = .05; city.player.add(ring);
  city.guide = makePerson({skin:'#c98e66', hair:'#111014', shirt:'#2ecfa8', pants:'#26233a', vest:'#1f8f74'});
  city.guide.position.set(3.2,0,6.2); city.guide.rotation.y = Math.atan2(-3.2, 3.3); S.add(city.guide);
  const gring = ring.clone(); gring.material = ring.material.clone(); gring.material.color.set('#2ecfa8'); city.guide.add(gring);
  city.obstacles.push({x:3.2,z:6.2,r:.6, guide:true});
  city.guide.traverse(o=>{ if(o.isMesh) o.userData.guide = true; });
  for(let i=0;i<10;i++){
    const p = makePerson({skin:pick(SKIN), hair:pick(HAIR), shirt:pick(SHIRT), pants:pick(PANTS), long:Math.random()<.3});
    const a = Math.random()*Math.PI*2, r = rnd(6,14);
    p.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    S.add(p);
    city.npcs.push({p, target:null, wait:rnd(0,3), speed:rnd(1.1,1.6)});
  }

  city.rtCam = new THREE.PerspectiveCamera(38, 16/9, .5, 200);
  city.rtCam.position.set(0, 24, 40); city.rtCam.lookAt(0, 3, 0);
}

/* =========================================================
   ROOM NAVIGATION
   ========================================================= */
const STOPS = ['board','desk','shelf'];
const SLOT = MODS.map((_,k)=>({z:.3 + (-1.05 + (k%4)*.7), y:k<4 ? 1.88 : .95}));
let stop = 'desk', sel = 0;
const cam = {pos:V(0,1.5,.75), tgt:V(0,1.1,-1.9), fov:44};
let tween = null;
const mouse = {x:0, y:0, sx:0, sy:0};
function stopParams(name){
  const asp = innerWidth/innerHeight, port = asp < .9, mid = !port && innerWidth < 900;
  if(name==='desk'){
    if(port) return {pos:V(0,1.62,1.25), tgt:V(0,.86,-1.9), fov:56};
    if(mid) return {pos:V(0,1.52,.9), tgt:V(0,1.0,-1.9), fov:48};
    return {pos:V(0,1.5,.72), tgt:V(-.42,1.06,-1.9), fov:44};
  }
  if(name==='board'){
    if(port) return {pos:V(.9,1.45,.25), tgt:V(-3.2,1.6,.25), fov:50};
    return {pos:V(.3,1.5,.25), tgt:V(-3.2,1.52,.25), fov:41};
  }
  // сөре: телефонда камера таңдалған ғимаратқа қарай жылжиды
  const k = SLOT[sel] || SLOT[0];
  if(port) return {pos:V(-.6,1.5,k.z), tgt:V(3.2,k.y-.1,k.z), fov:46};
  if(mid) return {pos:V(-1.4,1.45,.3), tgt:V(3.2,1.42,.3), fov:44};
  return {pos:V(-1.2,1.45,.3), tgt:V(3.2,1.42,-.55), fov:40};
}
function goStop(name, instant=false){
  if(!STOPS.includes(name)) name = 'desk';
  stop = name; document.body.dataset.stop = name;
  $$('[data-stop-btn]').forEach(b => b.classList.toggle('on', b.dataset.stopBtn === name));
  const p = stopParams(name);
  if(instant){ cam.pos.copy(p.pos); cam.tgt.copy(p.tgt); cam.fov = p.fov; tween = null; }
  else tween = {t:0, dur:1.25, from:{pos:cam.pos.clone(), tgt:cam.tgt.clone(), fov:cam.fov}, to:p};
  setURL();
}
const ease = k => k<.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2;
function updateRoom(dt, now){
  if(tween){
    tween.t += dt/tween.dur; const k = ease(Math.min(1,tween.t));
    cam.pos.lerpVectors(tween.from.pos, tween.to.pos, k);
    cam.tgt.lerpVectors(tween.from.tgt, tween.to.tgt, k);
    cam.fov = THREE.MathUtils.lerp(tween.from.fov, tween.to.fov, k);
    if(tween.t >= 1) tween = null;
  }
  mouse.sx += (mouse.x - mouse.sx)*.05; mouse.sy += (mouse.y - mouse.sy)*.05;
  const c = room.cam;
  const fwd = cam.tgt.clone().sub(cam.pos).normalize();
  const right = fwd.clone().cross(V(0,1,0)).normalize();
  c.position.copy(cam.pos).addScaledVector(right, mouse.sx*.07).add(V(0, -mouse.sy*.04, 0));
  c.lookAt(cam.tgt);
  if(c.fov !== cam.fov){ c.fov = cam.fov; c.updateProjectionMatrix(); }
  room.minis.forEach((b,i)=>{
    if(!b) return;
    const on = stop === 'shelf' && i === sel;
    const ty = b.userData.baseY + (on ? .03 : 0);
    b.position.y += (ty - b.position.y)*.12;
    const tr = on ? Math.sin(now*.0012)*.35 : (hoverIdx === i && stop === 'shelf' ? .15 : 0);
    b.rotation.y += (tr - b.rotation.y)*.08;
  });
  R.neon.material.opacity = .92 + Math.sin(now*.013)*.03 + (Math.random()<.004 ? -.5 : 0);
  // экрандағы батырма
  const btn = $('#screenBtn');
  const showBtn = stop === 'desk' && !tween && document.body.dataset.view === 'room';
  if(showBtn){
    const p = V(0,1.12,-1.9).project(c);
    btn.style.left = ((p.x+1)/2*innerWidth)+'px'; btn.style.top = ((1-p.y)/2*innerHeight)+'px';
  }
  btn.classList.toggle('show', showBtn);
  btn.tabIndex = showBtn ? 0 : -1;
}
function renderShelf(){
  const m = MODS[sel];
  $('#spCount').innerHTML = `${String(sel+1).padStart(2,'0')}<small>/ ${String(MODS.length).padStart(2,'0')}</small>`;
  $('#spTitle').textContent = L(m.name);
  $('#spMeta').innerHTML = `<i style="background:${m.color}"></i>${esc(L(m.place))} · ${esc(L(m.line))}`;
  $('#spDesc').textContent = L(m.desc);
  $('#spStats').innerHTML = m.stats.map(s=>`<div><b>${esc(s.v)}</b><span>${esc(s[LANG])}</span></div>`).join('');
  $('#spTags').innerHTML = L(m.tags).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
}
function selectMod(i){ sel = (i + MODS.length) % MODS.length; renderShelf(); if(stop === 'shelf' && innerWidth/innerHeight < .9) goStop('shelf'); }

/* =========================================================
   CITY CONTROL
   ========================================================= */
const keys = {};
const DEF_DIST = innerWidth/innerHeight < .9 ? 38 : 28;
const camC = {yaw:.55, pitch:.8, dist:DEF_DIST, tyaw:.55, tdist:DEF_DIST, tgt:V(0,0,9.5)};
let auto = null, near = null, showLabels = true, mapOpen = false;
const player = () => city.player;
function pushOut(p, r, skipGuide=false){
  for(const o of city.obstacles){
    if(skipGuide && o.guide) continue;
    const dx = p.x-o.x, dz = p.z-o.z, d = Math.hypot(dx,dz), min = o.r + r;
    if(d < min && d > 1e-5){ p.x = o.x + dx/d*min; p.z = o.z + dz/d*min; }
  }
  const d = Math.hypot(p.x,p.z);
  if(d > WORLD_R){ p.x *= WORLD_R/d; p.z *= WORLD_R/d; }
}
function wrapAng(d){ d = (d + Math.PI) % (Math.PI*2); if(d < 0) d += Math.PI*2; return d - Math.PI; }
function angLerp(a, b, k){ let d = ((b - a + Math.PI) % (Math.PI*2)) - Math.PI; if(d < -Math.PI) d += Math.PI*2; return a + d*k; }
function updateCity(dt, now, controlled){
  // NPC
  for(const n of city.npcs){
    if(!n.target){ n.wait -= dt; if(n.wait <= 0){ const a = Math.random()*Math.PI*2, r = rnd(5,14.5); n.target = V(Math.cos(a)*r,0,Math.sin(a)*r); } animPerson(n.p,0,dt); continue; }
    const d = n.target.clone().sub(n.p.position); d.y = 0;
    const dist = d.length();
    if(dist < .3){ n.target = null; n.wait = rnd(1,5); continue; }
    d.normalize();
    n.p.position.addScaledVector(d, n.speed*dt);
    pushOut(n.p.position, .35);
    n.p.rotation.y = angLerp(n.p.rotation.y, Math.atan2(d.x,d.z), .12);
    animPerson(n.p, n.speed, dt);
  }
  // гид қол бұлғайды
  const gu = city.guide.userData;
  const wave = (now % 5200) < 1400;
  gu.waving = wave;
  gu.armR.rotation.x = THREE.MathUtils.lerp(gu.armR.rotation.x, wave ? -2.6 + Math.sin(now*.012)*.35 : 0, .15);
  gu.armR.rotation.z = THREE.MathUtils.lerp(gu.armR.rotation.z, wave ? .25 : 0, .15);
  animPerson(city.guide, 0, dt);
  logoCube.rotation.y += dt*.6; logoCube.position.y = 3.4 + Math.sin(now*.0015)*.15;

  const pl = player();
  if(controlled){
    let ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
    let iz = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0);
    const mv = V(0,0,0);
    const run = keys.ShiftLeft || keys.ShiftRight;
    if(ix || iz){
      auto = null;
      const fwd = V(-Math.sin(camC.yaw),0,-Math.cos(camC.yaw)), right = V(Math.cos(camC.yaw),0,-Math.sin(camC.yaw));
      mv.addScaledVector(fwd,-iz).addScaledVector(right,ix).normalize().multiplyScalar(run ? 8.5 : 5.2);
    } else if(auto){
      const d = auto.pos.clone().sub(pl.position); d.y = 0;
      const dist = d.length();
      if(dist < .45){ const cb = auto.onArrive; auto = null; cb && cb(); }
      else mv.copy(d.normalize().multiplyScalar(Math.min(6.5, dist*3+1.5)));
    }
    const sp = mv.length();
    if(sp > 0){
      const before = pl.position.clone();
      pl.position.addScaledVector(mv, dt);
      pushOut(pl.position, .45);
      if(auto && pl.position.distanceTo(before) < sp*dt*.15) auto.stuck = (auto.stuck||0) + dt;
      if(auto && auto.stuck > .6){ const cb = auto.onArrive; auto = null; cb && cb(); }
      pl.rotation.y = angLerp(pl.rotation.y, Math.atan2(mv.x,mv.z), .2);
    }
    animPerson(pl, sp, dt);
    // жақын нысан
    let best = null, bd = 3;
    city.buildings.forEach((b,i)=>{ const d = b.entrance.distanceTo(pl.position); if(d < bd){ bd = d; best = {type:'b', i}; } });
    if(pl.position.distanceTo(city.guide.position) < 2.8) best = {type:'g'};
    near = best;
    const pr = $('#prompt');
    if(near && !anyModalOpen()){
      $('#promptTxt').textContent = near.type === 'g' ? t('prompt.talk') : `${t('prompt.enter')} — ${L(MODS[near.i].name)}`;
      pr.classList.add('show');
    } else pr.classList.remove('show');
  }
  // камера
  camC.yaw += (camC.tyaw - camC.yaw)*.12;
  camC.dist += (camC.tdist - camC.dist)*.12;
  camC.tgt.lerp(V(pl.position.x, 1.2, pl.position.z), .1);
  const c = city.cam, cp = Math.cos(camC.pitch);
  c.position.set(camC.tgt.x + Math.sin(camC.yaw)*cp*camC.dist, camC.tgt.y + Math.sin(camC.pitch)*camC.dist, camC.tgt.z + Math.cos(camC.yaw)*cp*camC.dist);
  c.lookAt(camC.tgt);
  // күн көлеңкесі ойыншыға еріп жүреді
  R.sun.position.copy(pl.position).add(city.sunOffset || V(34,15,10));
  R.sun.target.position.copy(pl.position);
}
function updateTags(){
  const c = city.cam, W = innerWidth, H = innerHeight;
  [[city.player,'#tagMe'],[city.guide,'#tagGuide']].forEach(([o,id])=>{
    const p = o.position.clone().add(V(0,2.55,0)).project(c);
    const el = $(id);
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1;
    el.style.display = vis ? '' : 'none';
    if(vis) el.style.transform = `translate(${(p.x+1)/2*W}px,${(1-p.y)/2*H}px) translate(-50%,-100%)`;
  });
}
function walkTo(pos, onArrive){ auto = {pos:pos.clone(), onArrive}; }
function goBuilding(i, open=true){

  camC.tyaw = camC.yaw + wrapAng(Math.atan2(-Math.cos(b.angle), -Math.sin(b.angle)) - camC.yaw);

}

function drawMap(){
  const cv = $('#minimap'), x = cv.getContext('2d'), S = cv.width, k = (S/2-14)/31;
  const light = THEME === 'light';
  x.clearRect(0,0,S,S);
  x.save(); x.translate(S/2,S/2);
  x.beginPath(); x.arc(0,0,S/2-8,0,Math.PI*2); x.fillStyle = light ? '#cfe3c0' : '#2c3b26'; x.fill();
  x.beginPath(); x.arc(0,0,30*k,0,Math.PI*2); x.fillStyle = light ? '#e7c3b7' : '#6a4640'; x.fill();
  x.beginPath(); x.arc(0,0,3*k,0,Math.PI*2); x.fillStyle = '#3aa6d0'; x.fill();
  city.buildings.forEach((b,i)=>{
    x.save(); x.translate(b.pos.x*k, b.pos.z*k); x.rotate(-b.rot);
    x.fillStyle = b.mod.color; x.beginPath(); x.roundRect(-3.3*k,-2.6*k,6.6*k,5.2*k,6); x.fill();
    x.restore();
    x.fillStyle = '#fff'; x.font = '700 22px "JetBrains Mono"'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(String(i+1), b.pos.x*k, b.pos.z*k);
  });
  const g = city.guide.position; x.beginPath(); x.arc(g.x*k, g.z*k, 9, 0, Math.PI*2); x.fillStyle = '#2ecfa8'; x.fill();
  const p = player().position, r = player().rotation.y;
  x.save(); x.translate(p.x*k, p.z*k); x.rotate(-r + Math.PI);
  x.beginPath(); x.moveTo(0,-16); x.lineTo(11,12); x.lineTo(0,6); x.lineTo(-11,12); x.closePath();
  x.fillStyle = '#fff'; x.strokeStyle = '#7c5cff'; x.lineWidth = 4; x.fill(); x.stroke();
  x.restore(); x.restore();
}

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hoverIdx = null;
let drag = null;
function setNdc(e){ ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); }
canvas.addEventListener('pointermove', e=>{
  mouse.x = e.clientX/innerWidth*2-1; mouse.y = e.clientY/innerHeight*2-1;
  if(view === 'room'){
    setNdc(e); ray.setFromCamera(ndc, room.cam);
    const hit = ray.intersectObjects(room.pick, false)[0];
    hoverIdx = hit && hit.object.userData.idx != null ? hit.object.userData.idx : null;
    const act = hit && (hit.object.userData.idx != null ? stop === 'shelf' : (hit.object.userData.act === 'city' && stop === 'desk') || (hit.object.userData.act === 'read' && stop === 'board'));
    canvas.style.cursor = act ? 'pointer' : '';
  } else if(drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(Math.abs(dx)+Math.abs(dy) > 6) drag.moved = true;
    if(drag.moved){ camC.tyaw -= (e.clientX - drag.lx)*.006; camC.pitch = THREE.MathUtils.clamp(camC.pitch + (e.clientY - drag.ly)*.004, .45, 1.25); }
    drag.lx = e.clientX; drag.ly = e.clientY;
  }
});
canvas.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, moved:false}; if(view==='city') canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', e=>{
  const d = drag; drag = null;
  if(!d || d.moved) return;
  setNdc(e);
  if(view === 'room'){
    ray.setFromCamera(ndc, room.cam);
    const hit = ray.intersectObjects(room.pick, false)[0];
    if(!hit) return;
    const u = hit.object.userData;
    if(u.idx != null){ if(stop !== 'shelf') goStop('shelf'); selectMod(u.idx); }
    else if(u.act === 'city' && stop === 'desk') setView('city');
    else if(u.act === 'read'){ if(stop === 'board') openRead(); else goStop('board'); }
    return;
  }
  ray.setFromCamera(ndc, city.cam);
  const gh = ray.intersectObject(city.guide, true)[0];
  if(gh){ goGuide(); return; }
  const bh = ray.intersectObjects(city.pick, false)[0];
  const gr = ray.intersectObjects(city.ground, false)[0];
  if(bh && (!gr || bh.distance < gr.distance)){ goBuilding(bh.object.userData.idx); return; }
  if(gr){ walkTo(V(gr.point.x,0,gr.point.z)); }
});

$('#spPrev').onclick = () => selectMod(sel-1);
$('#spNext').onclick = () => selectMod(sel+1);
$('#spCity').onclick = () => { const i = sel; setView('city', {then:()=>setTimeout(()=>goBuilding(i), 300)}); };
$('#guideCard').onclick = openChat;
$('#chatClose').onclick = closeChat;
$('#chatForm').onsubmit = e => { e.preventDefault(); const q = $('#chatInput').value.trim(); if(!q) return; $('#chatInput').value = ''; ask(q); };
$('#nList').onclick = () => { const h = $('#blist').classList.toggle('hide'); $('#nList').classList.toggle('on', !h); };
$('#nGuide').onclick = openChat;
$('#nMan').onclick = openRead;
$('#nPrice').onclick = openPrice;
$('#prompt').onclick = interact;
$('#tMap').onclick = () => { mapOpen = !mapOpen; $('#minimap').classList.toggle('hide', !mapOpen); $('#tMap').classList.toggle('on', mapOpen); };
$('#tLocate').onclick = () => { camC.tyaw = camC.yaw + wrapAng(.55 - camC.yaw); camC.tdist = DEF_DIST; camC.pitch = .8; updateZoom(); };
$('#tLabels').onclick = () => { showLabels = !showLabels; $('#tags').classList.toggle('off', !showLabels); $('#tLabels').classList.toggle('on', showLabels); };
$('#tHelp').onclick = () => toast(t(TOUCH ? 'help.touch' : 'help'));
$('#tZi').onclick = () => { camC.tdist = Math.max(12, camC.tdist/1.2); updateZoom(); };
$('#tZo').onclick = () => { camC.tdist = Math.min(52, camC.tdist*1.2); updateZoom(); };
$('#minimap').addEventListener('click', e=>{
  const r = e.currentTarget.getBoundingClientRect(), S = 400, k = (S/2-14)/31;
  const mx = (e.clientX - r.left)/r.width*S - S/2, mz = (e.clientY - r.top)/r.height*S - S/2;
  walkTo(V(mx/k, 0, mz/k));
});
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  for(const c of [room.cam, city.cam]){ c.aspect = innerWidth/innerHeight; c.updateProjectionMatrix(); }
  if(ready && view === 'room') goStop(stop, true);
});
if(innerWidth < 900){ $('#blist').classList.add('hide'); $('#nList').classList.remove('on'); }

/* avatar */
function avatarSvg(){
  return `<svg viewBox="0 0 16 16" width="100%" height="100%" shape-rendering="crispEdges"><rect width="16" height="16" fill="#2ecfa8" opacity=".25"/><rect x="4" y="3" width="8" height="8" fill="#c98e66"/><rect x="4" y="2" width="8" height="3" fill="#111014"/><rect x="6" y="7" width="1" height="1" fill="#16121c"/><rect x="9" y="7" width="1" height="1" fill="#16121c"/><rect x="3" y="11" width="10" height="5" fill="#2ecfa8"/><rect x="5" y="11" width="6" height="2" fill="#1f8f74"/></svg>`;
}
$('#guideAvatar').innerHTML = avatarSvg(); $('#chatAvatar').innerHTML = avatarSvg();

/* =========================================================
   LOOP & INIT
   ========================================================= */
let last = performance.now(), frame = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000); last = now; frame++;
  if(view === 'room'){
    updateRoom(dt, now);
    const screenVisible = stop === 'desk' || tween;
    updateCity(dt, now, false);
    if(screenVisible && frame % 2 === 0){
      renderer.setRenderTarget(room.rt); renderer.render(city.scene, city.rtCam); renderer.setRenderTarget(null);
    }
    renderer.render(room.scene, room.cam);
  } else {
    updateCity(dt, now, !anyModalOpen() || true);
    renderer.render(city.scene, city.cam);
    if(showLabels) updateTags();
    if(mapOpen && frame % 2 === 0) drawMap();
  }
}
function setLoad(p, key){
  $('#ldPct').textContent = Math.round(p)+'%'; $('#ldBar').style.width = p+'%';
  if(key) $('#ldStep').textContent = t(key);
}
async function init(){
  applyLang();
  setLoad(4,'load.s1');
  await Promise.race([
    Promise.all(['800 40px Unbounded','700 40px Unbounded','500 20px Manrope','700 20px Manrope','800 20px Manrope','500 20px "JetBrains Mono"','600 20px "JetBrains Mono"'].map(f=>document.fonts.load(f, 'ÖZGERIS қңүөәі'))),
    sleep(3500)
  ]);
  setLoad(28,'load.s2'); await nextFrame();
  buildRoom();
  setLoad(58,'load.s3'); await nextFrame();
  buildCity();
  setLoad(86,'load.s4'); await nextFrame();
  applyTheme(); applyLang(); updateZoom();
  renderer.compile(room.scene, room.cam); renderer.compile(city.scene, city.cam);
  setLoad(100);
  const q = START;
  const at = q.get('at');
  ready = true;
  goStop(STOPS.includes(at) ? at : 'desk', true);
  if(q.get('view') === 'city'){ view = 'room'; await setView('city', {fade:false}); }
  else { view = 'room'; document.body.dataset.view = 'room'; $$('[data-view-btn]').forEach(b => b.classList.toggle('on', b.dataset.viewBtn === 'room')); setURL(); }
  requestAnimationFrame(loop);
  await sleep(250);
  $('#loader').classList.add('done');
}
init().catch(err => { console.error(err); $('#ldStep').textContent = 'WebGL error: ' + err.message; });
</script>
