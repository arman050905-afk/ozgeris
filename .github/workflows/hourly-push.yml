name: Hourly push reminder

# ÖZGERIS-те шынайы сағаттық Web Push керек (қосымша толық жабық тұрса да келуі керек), бірақ
# Vercel Hobby жоспарында Cron Jobs күніне 1 реттен жиі жүрмейді. Сол шектеуді айналып өту үшін
# бұл GitHub Actions workflow сағат сайын оянып, api/cron/check-alerts.js эндпоинтін шақырады —
# нақты push жіберу логикасы (VAPID, web-push кітапханасы) толығымен сол Vercel функциясында
# қалады, бұл жерде тек "ояту" ғана бар. Тегін: public/private репода Actions minutes ақысыз.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call ÖZGERIS check-alerts endpoint
        run: |
          curl -sf -X GET "https://ozgerisozindiozgert-swart.vercel.app/api/cron/check-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
